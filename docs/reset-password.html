<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset your FLOQQ password</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0A0A12;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: #15151F;
    border: 1px solid #2A2A3D;
    border-radius: 16px;
    padding: 28px 24px;
  }
  h1 {
    color: #FFFFFF;
    font-size: 22px;
    margin: 0 0 20px;
    text-align: center;
  }
  input {
    width: 100%;
    background: #0A0A12;
    border: 1px solid #2A2A3D;
    border-radius: 12px;
    padding: 14px 16px;
    color: #FFFFFF;
    font-size: 16px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    background: #8B5CF6;
    border: none;
    border-radius: 999px;
    padding: 14px;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  p.message {
    color: #A5A5B8;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
  }
  p.error { color: #F87171; }
  p.success { color: #F2C14E; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <div id="form-state" hidden>
      <input id="password" type="password" placeholder="New password" autocomplete="new-password" />
      <input id="confirm" type="password" placeholder="Confirm new password" autocomplete="new-password" />
      <p id="form-error" class="message error" hidden></p>
      <button id="submit-btn" type="button">Update password</button>
    </div>
    <p id="invalid-state" class="message error" hidden>
      This link is invalid or has expired. Go back to the FLOQQ app and request a new one.
    </p>
    <p id="success-state" class="message success" hidden>
      Password updated. You can close this page and log in with your new password in the FLOQQ app.
    </p>
  </div>
  <script>
    (function () {
      // Same public anon key already shipped inside the FLOQQ app itself (EXPO_PUBLIC_SUPABASE_ANON_KEY) -
      // safe to embed in a public static page, it only grants what RLS/Auth policies already allow.
      var SUPABASE_URL = "https://notpvjikdbbelrdgplkc.supabase.co";
      var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vdHB2amlrZGJiZWxyZGdwbGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwODI1NTUsImV4cCI6MjEwNDY1ODU1NX0.Juv8XdBlYwaGK1v30KiBuTms71FuxFQTRC86AzKVtFg";

      var hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      var accessToken = hashParams.get('access_token');
      var type = hashParams.get('type');

      var formState = document.getElementById('form-state');
      var invalidState = document.getElementById('invalid-state');
      var successState = document.getElementById('success-state');
      var formError = document.getElementById('form-error');

      if (!accessToken || type !== 'recovery') {
        invalidState.hidden = false;
        return;
      }
      formState.hidden = false;

      document.getElementById('submit-btn').addEventListener('click', function () {
        formError.hidden = true;
        var password = document.getElementById('password').value;
        var confirm = document.getElementById('confirm').value;

        if (password.length < 6) {
          formError.textContent = 'Password must be at least 6 characters.';
          formError.hidden = false;
          return;
        }
        if (password !== confirm) {
          formError.textContent = "Passwords don't match.";
          formError.hidden = false;
          return;
        }

        var btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'Updating…';

        fetch(SUPABASE_URL + '/auth/v1/user', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            apikey: ANON_KEY,
            Authorization: 'Bearer ' + accessToken,
          },
          body: JSON.stringify({ password: password }),
        })
          .then(function (res) {
            return res.json().then(function (body) {
              return { ok: res.ok, body: body };
            });
          })
          .then(function (result) {
            if (!result.ok) throw new Error(result.body && result.body.msg ? result.body.msg : 'Could not update password.');
            formState.hidden = true;
            successState.hidden = false;
          })
          .catch(function (err) {
            btn.disabled = false;
            btn.textContent = 'Update password';
            formError.textContent = err.message;
            formError.hidden = false;
          });
      });
    })();
  </script>
</body>
</html>
