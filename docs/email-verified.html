<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FLOQQ – Email verified</title>
<link rel="icon" href="floqq-logo.png" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0B0F19;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: #1E293B;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
  }
  img.logo { width: 64px; height: 64px; border-radius: 14px; }
  h1 { color: #F8FAFC; font-size: 22px; margin: 16px 0 8px; }
  h1.success { color: #22C55E; }
  h1.error { color: #F87171; }
  p { color: #94A3B8; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
  a.button {
    display: block;
    background: #7C3AED;
    border-radius: 999px;
    padding: 14px;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
  }
  p.small { font-size: 13px; margin: 16px 0 0; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="floqq-logo.png" alt="FLOQQ" />
    <h1 id="title"></h1>
    <p id="body"></p>
    <a id="open-app" class="button" hidden></a>
    <p id="fallback" class="small" hidden></p>
  </div>
  <script>
    (function () {
      // Landing page for the "Verify my email" link (emailRedirectTo in
      // src/services/emailVerification.ts). By the time Supabase redirects here it has already
      // marked the email verified; this page only confirms it and hands the session on to the
      // app via floqq://email-verified#access_token=…&refresh_token=… (handled in App.tsx).
      var TEXT = {
        en: {
          title: 'Email verified ✓',
          body: 'Welcome to FLOQQ! Your account is ready.',
          open: 'Open FLOQQ',
          fallback: 'If the app doesn’t open, just open FLOQQ on your phone and log in.',
          errorTitle: 'This link has expired',
          errorBody: 'Open the FLOQQ app, try to log in, and tap “Resend verification email” to get a new link.'
        },
        es: {
          title: 'Correo verificado ✓',
          body: '¡Bienvenido a FLOQQ! Tu cuenta ya está lista.',
          open: 'Abrir FLOQQ',
          fallback: 'Si la app no se abre, abre FLOQQ en tu móvil e inicia sesión.',
          errorTitle: 'Este enlace ha caducado',
          errorBody: 'Abre la app FLOQQ, intenta iniciar sesión y pulsa «Reenviar correo de verificación» para recibir un enlace nuevo.'
        },
        fr: {
          title: 'E-mail vérifié ✓',
          body: 'Bienvenue sur FLOQQ ! Votre compte est prêt.',
          open: 'Ouvrir FLOQQ',
          fallback: 'Si l’application ne s’ouvre pas, ouvrez FLOQQ sur votre téléphone et connectez-vous.',
          errorTitle: 'Ce lien a expiré',
          errorBody: 'Ouvrez l’application FLOQQ, essayez de vous connecter et touchez « Renvoyer l’e-mail de vérification » pour recevoir un nouveau lien.'
        }
      };

      var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      var query = new URLSearchParams(window.location.search);
      var accessToken = hash.get('access_token');
      var refreshToken = hash.get('refresh_token');
      var hasError = hash.get('error') || query.get('error');

      // The language chosen at sign-up is in the token's user_metadata; fall back to the browser.
      function languageFromToken(token) {
        try {
          var payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          var json = JSON.parse(decodeURIComponent(escape(atob(payload))));
          return json.user_metadata && json.user_metadata.language;
        } catch (e) {
          return null;
        }
      }
      var lang = (accessToken && languageFromToken(accessToken)) || (navigator.language || 'en').slice(0, 2);
      var t = TEXT[lang] || TEXT.en;
      document.documentElement.lang = TEXT[lang] ? lang : 'en';

      var title = document.getElementById('title');
      var body = document.getElementById('body');

      if (hasError || !accessToken || !refreshToken) {
        title.textContent = t.errorTitle;
        title.className = 'error';
        body.textContent = t.errorBody;
        return;
      }

      title.textContent = t.title;
      title.className = 'success';
      body.textContent = t.body;

      var open = document.getElementById('open-app');
      open.textContent = t.open;
      open.href = 'floqq://email-verified#access_token=' + encodeURIComponent(accessToken) +
        '&refresh_token=' + encodeURIComponent(refreshToken);
      open.hidden = false;

      var fallback = document.getElementById('fallback');
      fallback.textContent = t.fallback;
      fallback.hidden = false;

      // Keep the tokens out of the browser history once they've been read.
      history.replaceState(null, '', window.location.pathname);
    })();
  </script>
</body>
</html>
